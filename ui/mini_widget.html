<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>OC-GO Mini</title>
<style>
  /* 兜底默认主题（neon-green）；pywebviewready 后由 theme_css 覆盖 */
  :root {
    --accent: #537d96;
    --accent2: #6f9cb5;
    --bg: #f5efe4;
    --text: #2a2622;
    --muted: #7a7266;
    --glow: rgba(83, 125, 150, 0.25);
    --warn: #d97706;
    --danger: #b91c1c;
    --line: rgba(42, 38, 34, 0.12);
    --panel: rgba(83, 125, 150, 0.06);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  html, body { background: #080e0c; overflow: hidden; height: 100%; }
  body {
    font-family:var(--font-ui);
    color: var(--text);
  }

  .hud {
    height: 100vh;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 10px 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    position: relative;
    z-index: 1;    /* 抬升内容层：主题 body::before 网格（8bit 等 z-index:0）不再遮挡内容 */
    box-shadow: 0 0 18px var(--glow), inset 0 0 24px var(--panel);
    cursor: pointer;
    /* 内容自适应窗口高度：窗口过矮时优先内部滚动，内容不丢 */
    overflow-y: auto;
    scrollbar-width: none;
  }
  .hud::-webkit-scrollbar, .detail-overlay::-webkit-scrollbar { display: none; }
  /* 顶部拖拽区：覆盖整条顶部（topbar 之上一层），右侧按钮组再上一层保证可点 */
  .drag-top {
    position: absolute; top: 0; left: 0; right: 0; height: 30px;
    cursor: move; z-index: 9;
    border-radius: 8px 8px 0 0;
    background: transparent;
    transition: background .15s ease;
  }
  .drag-top:hover { background: rgba(255, 255, 255, 0.08); }
  /* 按钮组抬升到拖拽区之上（否则点击被 drag-top 拦截，按钮永久失效） */
  .topbtns{position:relative; z-index:10;}
  /* 右下角 resize 把手 */
  .resize-handle {
    position: absolute; right: 2px; bottom: 2px;
    width: 14px; height: 14px;
    cursor: nwse-resize; z-index: 7;
    background: linear-gradient(135deg, transparent 45%, var(--accent) 45%, var(--accent) 55%, transparent 55%),
                linear-gradient(135deg, transparent 70%, var(--muted) 70%, var(--muted) 80%, transparent 80%);
    opacity: .7;
  }
  .resize-handle:hover { opacity: 1; }
  /* 尺寸拖拽条：右侧改宽、底部改高 */
  .resize-x, .resize-y {
    position: absolute; z-index: 7;
    background: transparent;
    transition: background .15s ease;
  }
  .resize-x {
    top: 20px; bottom: 16px; right: 1px; width: 6px;
    cursor: ew-resize; border-radius: 3px;
  }
  .resize-y {
    left: 2px; right: 16px; bottom: 1px; height: 6px;
    cursor: ns-resize; border-radius: 3px;
  }
  .resize-x:hover, .resize-y:hover { background: rgba(255,255,255,0.12); }
  .resize-x:active, .resize-y:active { background: rgba(255,255,255,0.2); }
  .hud::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: 10px 10px 0 0;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.8;
  }

  /* 顶栏 */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    position: relative;
    /* z-index 不设（auto）：若设 8 会创建层叠上下文困住内部 topbtns(z10)，
       导致按钮整体低于 drag-top(z9) 被拦截点击——drag-top 透明，logo 区仍可拖 */
  }
  .logo { display: flex; align-items: center; gap: 6px; flex-shrink: 0; min-width: 0; }
  .logo .pname { color: var(--accent); font-weight: 700; letter-spacing: 1px; font-size: 9.5px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: 1px; }
  .logo .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .logo b { color: var(--accent); font-weight: 600; letter-spacing: 1px; }
  .topbtns { display: flex; align-items: center; gap: 7px; position: relative; z-index: 10; }
  .live {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent); font-size: 9px; letter-spacing: 1px;
  }
  .live .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 5px var(--accent); }
  .live.stale { color: var(--warn); }
  .live.stale .dot { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
  .live.dead { color: var(--danger); }
  .live.dead .dot { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
  .refresh {
    background: none; border: 1px solid var(--line); color: var(--accent);
    font-size: 12px; width: 19px; height: 19px; line-height: 17px;
    border-radius: 4px; cursor: pointer; text-align: center; padding: 0;
  }
  .refresh:hover { background: var(--panel); }
  .refresh.spin { animation: spin 0.6s linear; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 中部大数字 */
  .today {
    display: flex; align-items: baseline; gap: 7px;
    /* 窗口过矮时允许压缩大数字区（其余区块保底不压） */
    flex: 0 1 auto;
    min-height: 0;
    overflow: hidden;
  }
  .today .big {
    font-family:var(--font-num);
    font-size: clamp(22px, 14vh, 30px); font-weight: 800;
    color: var(--accent);
    text-shadow: 0 0 12px var(--glow), 0 0 28px var(--glow);
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .today .meta {
    font-size: 9px; color: var(--muted); line-height: 1.35;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }
  .today .meta b { color: var(--accent); font-weight: 700; }

  /* 月度进度条 */
  .barwrap { display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto; }
  .barhead {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8.5px; letter-spacing: 1.5px; color: var(--muted);
  }
  .barhead .val { color: var(--accent); font-family:var(--font-num); font-size: 10px; }
  .bar {
    height: 5px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.06);
    overflow: hidden;
  }
  .bar .fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    box-shadow: 0 0 8px var(--glow);
    transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .bar .fill.warn { background: linear-gradient(90deg, rgba(255,200,87,0.55), var(--warn)); box-shadow: 0 0 8px var(--warn); }
  .bar .fill.danger { background: linear-gradient(90deg, rgba(255,95,86,0.55), var(--danger)); box-shadow: 0 0 8px var(--danger); }
  .barfoot {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8px; color: var(--muted); letter-spacing: 0.5px;
  }
  .barfoot b { color: var(--text); font-weight: 600; font-family:var(--font-num); font-size: 9px; }

  /* 底部小字 */
  .subrow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8.5px; color: var(--muted);
    border-top: 1px solid var(--line);
    padding-top: 4px;
    flex: 0 0 auto;
  }
  .subrow .item { display: flex; gap: 4px; align-items: baseline; white-space: nowrap; }
  .subrow b {
    font-family:var(--font-num); font-weight: 600; color: var(--text);
    font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .subrow b.good { color: var(--accent); text-shadow: 0 0 6px var(--glow); }
  .foot {
    font-size: 8px; color: var(--muted);
    text-align: right; letter-spacing: 0.5px;
    opacity: 0.6;
    margin-top: auto;
    flex: 0 0 auto;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
  }

  /* 详情浮层（点击展开，覆盖主视图，不撑大窗口） */
  .detail-overlay {
    position: absolute; inset: 0;
    border-radius: 10px;
    background: var(--bg);
    display: none;
    flex-direction: column;
    gap: 5px;
    padding: 9px 12px 7px;
    z-index: 5;
    /* 窗口过矮时详情列表可滚动查看 */
    overflow-y: auto;
    scrollbar-width: none;
  }
  .hud.detail-on .detail-overlay { display: flex; }
  .detail-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 9px; letter-spacing: 2px; color: var(--accent);
    padding-bottom: 3px;
    border-bottom: 1px solid var(--line);
  }
  .detail-head .hint { font-size: 8px; color: var(--muted); letter-spacing: 0.5px; opacity: 0.7; }
  .dstats {
    display: flex; flex-direction: column; gap: 3px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 5px; margin-bottom: 5px;
  }
  .dstat { display: flex; justify-content: space-between; align-items: baseline; font-size: 9px; color: var(--muted); }
  .dstat b {
    color: var(--text); font-weight: 600; font-family:var(--font-num);
    font-size: 10px; font-variant-numeric: tabular-nums;
  }
  .dstat b.good { color: var(--accent); }
  .dstat b.dim { color: var(--muted); }
  .dlist { display: flex; flex-direction: column; gap: 6px; flex: 1; overflow: hidden; }
  .drow {
    display: flex; align-items: center; gap: 8px;
    font-size: 9px; color: var(--muted);
  }
  .drow .label { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .drow .mini {
    width: 90px; height: 4px; border-radius: 2px;
    background: rgba(255, 255, 255, 0.06); overflow: hidden; flex: none;
  }
  .drow .mini i {
    display: block; height: 100%; border-radius: 2px;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    box-shadow: 0 0 5px var(--glow);
  }
  .drow b {
    width: 34px; text-align: right; flex: none;
    color: var(--text); font-weight: 600;
    font-family:var(--font-num); font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .drow .reset { width: 46px; text-align: right; flex: none; font-size: 8px; }
  .dempty { font-size: 9px; color: var(--muted); opacity: 0.7; text-align: center; margin-top: 12px; }

/* ---- 悬浮球形态 ---- */
.ball-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:3px; padding:6px; cursor:pointer; user-select:none;}
.ball-svg{width:104px; height:104px; flex:none;}
.ball-name{font-size:10px; color:var(--muted); max-width:92%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.ball-hint{font-size:8px; color:var(--muted); opacity:.65;}
.ball-svg.dim{display:flex; align-items:center; justify-content:center; color:var(--muted);}
/* ---- 桌宠形态 ---- */
.pet-wrap{display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:5px; padding:8px; cursor:pointer; user-select:none;}
.pet-face{font-size:44px; line-height:1; animation:pet-breathe 2.4s ease-in-out infinite; filter:drop-shadow(0 0 10px var(--glow));}
@keyframes pet-breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
.pet-bubble{font-size:10px; color:var(--text); background:rgba(255,255,255,.06); border:1px solid var(--line); border-radius:10px; padding:4px 10px; max-width:96%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

/* 形态：整窗透明（球/宠物外形即窗口） */
body.style-ball, body.style-pet{background:transparent !important;}
body.style-ball #hud, body.style-pet #hud{background:transparent; border:none; box-shadow:none;}
body.style-ball #hud, body.style-pet #hud{background:transparent; border:none; box-shadow:none; padding:0; overflow:visible;}
body.style-ball .topbar, body.style-pet .topbar{display:none;}
body.style-ball #hud, body.style-pet #hud{justify-content:center; align-items:center;}
body.style-ball .ball-wrap, body.style-pet .pet-wrap{height:100%; padding:0;}
body.style-ball .ball-wrap{justify-content:center;}
body.style-ball .liquid-ball{width:126px; height:126px;}
body.style-ball .ball-name, body.style-ball .ball-hint{display:none;}
body.style-pet .pet-face{font-size:56px;}

/* ---- 360 液体球 ---- */
.liquid-ball{position:relative; width:118px; height:118px; border-radius:50%; overflow:hidden; border:2px solid var(--accent); background:rgba(255,255,255,.03); box-shadow:0 0 20px var(--glow), inset 0 0 16px rgba(0,0,0,.3); flex:none;}
.lb-liquid{position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg, var(--accent2), var(--accent)); transition:height .9s cubic-bezier(.3,.7,.3,1);}
.lb-wave{position:absolute; top:-12px; left:-80px; right:-80px; height:14px; background:radial-gradient(ellipse at center, rgba(255,255,255,.32) 55%, transparent 56%) repeat-x; background-size:46px 14px; animation:lbWave 2.8s linear infinite;}
@keyframes lbWave{0%{transform:translateX(0);}100%{transform:translateX(46px);}}
.lb-center{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; pointer-events:none; gap:0;}
.lb-pct{font-family:var(--font-num); font-size:26px; font-weight:700; color:var(--text); text-shadow:0 1px 3px rgba(0,0,0,.45); line-height:1;}
.lb-unit{font-size:10px; color:var(--muted); letter-spacing:1px;}

/* ============ 前端优化层（design-taste：统一状态/焦点/动效/对比度） ============ */
:root{
  --surface-hover:rgba(255,255,255,.06);
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --shadow-sm:0 2px 8px rgba(0,0,0,.22);
  --transition:.18s cubic-bezier(.16,1,.3,1);
  --focus-ring:0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  --grid-line:rgba(128,128,128,.13);
  /* 字体 token（与主面板一致；主题可覆盖） */
  --font-ui:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  --font-num:Consolas,"JetBrains Mono",monospace;
}
/* 滚动条（细 + 主题灰） */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.22);border-radius:4px;}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.42);}
/* 键盘焦点（可访问性） */
:focus-visible{outline:none; box-shadow:var(--focus-ring); border-radius:var(--radius-sm,6px);}
/* 减少动效偏好：全部动画瞬间完成 */
/* ===== 动态氛围层（2026-08-08 UI 上强度，与主面板同步）===== */
/* 详情浮层进度条流动光泽 */
.drow .mini i::after{
  content:''; position:absolute; top:0; bottom:0; left:-30%; width:22%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
  transform:skewX(-18deg);
  animation: miniFillFlow 2.6s linear infinite;
  pointer-events:none;
}
@keyframes miniFillFlow{
  from{left:-30%;}
  to{left:112%;}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}
/* 数字等宽（对齐整齐） */
.meta-v,.bal-amount,.te-row b,.lg-row b,.pct,.spark-val,.sb-val,.dstat b,.stat-v{font-variant-numeric:tabular-nums;}
/* 卡片微反馈（hover 抬升 + 阴影，克制） */
.pcard,.prow-card{transition:transform var(--transition), box-shadow var(--transition), border-color var(--transition);}
.pcard:hover,.prow-card:hover{transform:translateY(-1px); box-shadow:var(--shadow-sm); border-color:var(--accent);}
/* 按钮统一状态 */
button{transition:background var(--transition), border-color var(--transition), color var(--transition), opacity var(--transition), transform var(--transition);}
button:active:not(:disabled){transform:scale(.97);}
button:disabled{opacity:.4; cursor:not-allowed;}
/* 输入/下拉 focus */
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--accent); box-shadow:var(--focus-ring);}
/* 页面切换淡入（克制） */
.page{animation:pageIn .26s ease-out;}
@keyframes pageIn{from{opacity:0; transform:translateY(5px);}to{opacity:1; transform:none;}}
/* 图表网格线统一 */
.sb-grid{stroke:var(--grid-line);}
/* ===== 质感层（2026-08-08 美化：呼吸状态灯 / 进度条光泽，与主面板一致） ===== */
@keyframes healthPulse{0%,100%{opacity:1;}50%{opacity:.45;}}
.live .dot{animation:healthPulse 2.4s ease-in-out infinite;}
.bar .fill{position:relative;}
.bar .fill::after{
  content:''; position:absolute; left:2px; right:2px; top:1px; height:38%;
  background:linear-gradient(180deg, rgba(255,255,255,.30), rgba(255,255,255,0));
  border-radius:inherit; pointer-events:none;
}
</style>
<script>document.write('<script src="i18n.js?v=' + Date.now() + '"><\/script>');</script>
</head>
<body>
  <div class="hud" id="hud">
    <div class="drag-top pywebview-drag-region"></div>
    <div class="topbar">
      <div class="logo"><span class="dot"></span><b>OC-GO</b>&nbsp;<span class="pname" id="pname"></span></div>
      <div class="topbtns">
        <span class="live" id="live"><span class="dot"></span>LIVE</span>
        <button class="refresh" id="refresh" data-i18n-title="立即刷新" title="立即刷新" onclick="if(window.__miniRefresh)window.__miniRefresh()">↻</button>
        <button class="minhide" id="minHide" data-i18n-title="隐藏悬浮窗" title="隐藏悬浮窗" onclick="if(window.__miniHide)window.__miniHide()">×</button>
      </div>
    </div>

    <div class="today">
      <span class="big" id="todayBig">—</span>
      <span class="meta" id="todayMeta" data-i18n="等待数据">等待数据</span>
    </div>

    <div class="barwrap">
      <div class="barhead">
        <span id="barLabel">MONTHLY LIMIT</span>
        <span class="val" id="monthlyVal">--%</span>
      </div>
      <div class="bar"><div class="fill" id="monthlyFill" style="width:0%"></div></div>
      <div class="barfoot">
        <span id="monthlyMoney">--</span>
        <span data-i18n="重置">重置 <b id="resetText">--</b></span>
      </div>
    </div>

    <div class="subrow">
      <div class="item"><span data-i18n="还能撑">还能撑</span><b class="good" id="daysLeft">—</b></div>
      <div class="item"><span data-i18n="滚动">滚动</span><b id="rollVal">--%</b></div>
      <div class="item"><span data-i18n="每周">每周</span><b id="weekVal">--%</b></div>
    </div>

    <div class="foot" id="foot" data-i18n="更新时间 --">更新时间 --</div>

    <div class="detail-overlay" id="detail">
      <div class="detail-head"><span>LIMITS</span><span class="hint" data-i18n="点击收起">点击收起</span></div>
      <div class="dstats">
        <div class="dstat"><span data-i18n="今日用量">今日用量</span><b id="dToday">—</b></div>
        <div class="dstat"><span data-i18n="余额">余额</span><b id="dBal">—</b></div>
        <div class="dstat"><span data-i18n="当前速度">当前速度</span><b id="dCur">—</b></div>
        <div class="dstat"><span data-i18n="3日趋势">3日趋势</span><b id="dAvg">—</b></div>
      </div>
      <div class="dlist" id="dlist"></div>
    </div>

    <div class="resize-x" id="resizeX" data-i18n-title="左右拖动改宽度" title="左右拖动改宽度"></div>
    <div class="resize-y" id="resizeY" data-i18n-title="上下拖动改高度" title="上下拖动改高度"></div>
    <div class="resize-handle" id="resizeHandle" data-i18n-title="拖动调整大小" title="拖动调整大小"></div>
  </div>

<script>
  /* ===== 按钮三重保险（2026-08-08）：inline onclick 直接调用全局函数，任何绑定时序/异常都不影响 ===== */
  window.__miniBusy = false;
  window.__miniRefresh = function(){
    if (window.__miniBusy) return;
    window.__miniBusy = true;
    if (window.__miniProbe) window.__miniProbe('refresh-click');
    var r = document.getElementById('refresh');
    if (r) r.classList.add('spin');
    var done = function(){ window.__miniBusy = false; if (r) setTimeout(function(){ r.classList.remove('spin'); }, 600); };
    var task = Promise.resolve();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.refresh_now) {
      task = task.then(function(){ return window.pywebview.api.refresh_now(); });
    }
    if (window.__mini && window.__mini.pull) {
      task = task.then(function(){ return window.__mini.pull(); });
    }
    task.then(done, done);
  };
  window.__miniHide = function(){
    if (window.__miniProbe) window.__miniProbe('hide-click');
    if (window.pywebview && window.pywebview.api && window.pywebview.api.hide_mini) {
      window.pywebview.api.hide_mini().catch(function(){});
    }
  };

   window.__initErr = null;
  window.addEventListener('error', function(e){ if(!window.__initErr) window.__initErr = 'evt:' + e.message; });
  /* ===== 诊断探针（2026-08-08）：上报桥状态与按钮点击到后端日志 ===== */
  (function(){
    var probe = function(tag){
      try{
        if(window.pywebview && window.pywebview.api && window.pywebview.api.mini_ping){
          window.pywebview.api.mini_ping(tag).catch(function(){});
        }
      }catch(e){}
    };
    window.__miniProbe = probe;
    probe('boot:' + (window.pywebview && window.pywebview.api ? 'api-ok' : 'NO-API') +
      '|' + String(location.href).slice(-24) +
      '|err:' + (window.__initErr || 'none'));
    /* 延迟重试（桥可能晚注入；拿页面 JS 错误证据） */
    setTimeout(function(){
      probe('boot2:' + (window.pywebview && window.pywebview.api ? 'api-ok' : 'NO-API') +
        '|err:' + (window.__initErr || 'none'));
    }, 2000);
    setTimeout(function(){
      probe('boot3:err:' + (window.__initErr || 'none'));
    }, 6000);
  })();

  /* DOM 交互绑定统一延迟到 DOM 就绪（WebView2 解析时序下立即执行可能取不到元素） */
  function initInteractions(){
    window.__initErr = window.__initErr || null;
  let detailOn = false;
  let viewData = null;
  const $ = id => document.getElementById(id);
  const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));

  function setLive(state) {
    const el = $('live');
    if (!el) return;
    el.className = 'live' + (state === 'ok' ? '' : state === 'stale' ? ' stale' : ' dead');
    el.lastChild.textContent = state === 'ok' ? 'LIVE' : state === 'stale' ? 'STALE' : 'EXPIRED';
  }
  /* 形态切换：显示/隐藏经典内容区 */
  function setStyleHost(show) {
    const els = ['.today', '.barwrap', '.subrow', '.foot', '.detail-overlay'];
    els.forEach(function(sel){ $$(sel).forEach(function(e){ e.style.display = show ? '' : 'none'; }); });
    const host = $('styleHost');
    if (show && host) host.parentNode.removeChild(host);
    if (!show && !host) {
      const d = document.createElement('div');
      d.id = 'styleHost';
      $('hud').appendChild(d);
    }
    return show ? null : $('styleHost');
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g,
      c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtUsd(v) {
    return '$' + (v == null ? 0 : v).toFixed(2);
  }

  /* 后端中文单位文本 → 英文单位（d/h） */
  function fmtDaysText(txt) {
    if (!txt || I18N.getLang() !== 'en') return txt;
    return String(txt).replace(/天/g, 'd').replace(/小时/g, 'h').replace(/时/g, 'h');
  }
  function fmtMoney(v, cur) {
    if (v == null || isNaN(v)) return '—';
    if (cur === 'CNY') return '¥' + Number(v).toFixed(2);
    if (cur === 'USD') return '$' + Number(v).toFixed(2);
    return (cur ? cur + ' ' : '') + Number(v).toFixed(2);
  }

  function isPeakNow() {
    const h = new Date().getHours();
    return (h >= 9 && h < 12) || (h >= 14 && h < 18);
  }

  function fmtReset(sec) {
    if (sec == null || isNaN(sec) || sec < 0) return '--';
    const d = Math.floor(sec / 86400);
    const h = Math.floor((sec % 86400) / 3600);
    const m = Math.floor((sec % 3600) / 60);
    if (d > 0) return d + I18N.t('天') + h + I18N.t('时');
    if (h > 0) return h + I18N.t('时') + m + I18N.t('分');
    return m + I18N.t('分钟');
  }

  function firstProvider(v, wantPid) {
    if (!v || !v.providers) return null;
    const keys = Object.keys(v.providers);   // 对象键顺序 = config 顺序
    if (!keys.length) return null;
    // 显式指定 pid（点击大数字切换）优先
    if (wantPid && v.providers[wantPid]) return { pid: wantPid, p: v.providers[wantPid] };
    // DIY：迷你窗指定供应商（diy.mini_provider，空 = 拖拽顺序第一个 / 自动第一个启用）
    const diyPid = v.settings && v.settings.diy && v.settings.diy.mini_provider;
    if (diyPid && v.providers[diyPid]) return { pid: diyPid, p: v.providers[diyPid] };
    const orderPids = (v.settings && v.settings.order && v.settings.order.providers) || [];
    if (orderPids.length) {
      const o = orderPids.find(pid => v.providers[pid]);
      if (o) return { pid: o, p: v.providers[o] };
    }
    return { pid: keys[0], p: v.providers[keys[0]] };
  }

  function renderDetail(limits) {
    const list = (limits || []).slice(0, 3);
    const box = $('dlist');
    box.innerHTML = '';
    if (!list.length) {
      box.innerHTML = I18N.t('<div class="dempty">暂无额度数据</div>');
      return;
    }
    list.forEach(l => {
      const pctVal = l.used_pct;
      const p = Math.min(100, Math.max(0, pctVal == null ? 0 : pctVal));
      const row = document.createElement('div');
      row.className = 'drow';
      const barColor = pctVal != null && pctVal >= 95 ? 'background:var(--danger);box-shadow:0 0 5px var(--danger);'
                     : pctVal != null && pctVal >= 80 ? 'background:var(--warn);box-shadow:0 0 5px var(--warn);'
                     : '';
      row.innerHTML =
        '<span class="label">' + I18N.t(esc(l.label || l.id)) + '</span>' +
        '<span class="mini"><i style="width:' + p + '%' + (barColor ? ';' + barColor : '') + '"></i></span>' +
        '<b>' + (pctVal == null ? '--' : Math.round(pctVal) + '%') + '</b>' +
        '<span class="reset">' + fmtReset(l.reset_in_sec) + '</span>';
      box.appendChild(row);
    });
  }

  function render(v) {
    viewData = v;
    if (v && v.settings && v.settings.ui && v.settings.ui.lang) {
      I18N.setLang(v.settings.ui.lang);
    }
    I18N.apply();
    try {
      if (v && v.settings && v.settings.theme) {
        document.body.setAttribute('data-style', v.settings.theme.id || 'paper');
      }
      if (v && v.theme_css) {
        $$('style[data-theme]').forEach(function(s){ s.parentNode && s.parentNode.removeChild(s); });
        var html = /^\s*<style/i.test(v.theme_css) ? v.theme_css : '<style data-theme="t">'+v.theme_css+'</style>';
        document.head.insertAdjacentHTML('beforeend', html);
      }
    } catch (e) {
      // 主题注入失败不阻断数据渲染
    }
    setStyleHost(true);
    const fp = firstProvider(v, window.__miniCur && window.__miniCur.pid);
    if (fp) { window.__miniCur = window.__miniCur || {}; window.__miniCur.pid = fp.pid; }
    const p = fp ? fp.p : null;
    const pnameEl = $('pname');
    if (pnameEl) {
      /* 显示名优先用设置里的配置名（用户可改中文名），其次 provider 自带名 */
      const dispName = (v.settings && v.settings.providers && v.settings.providers[fp.pid] && v.settings.providers[fp.pid].name)
        || p.name || fp.pid;
      pnameEl.textContent = fp ? dispName : '';
    }
    if (!p) {
      setLive('dead');
      $('todayBig').textContent = '—';
      $('todayMeta').textContent = I18N.t('等待数据');
      $('foot').textContent = I18N.t('请打开主面板配置');
      return;
    }

    const age = Date.now() / 1000 - (p.fetched_at || 0);
    // STALE 阈值跟随可配置抓取间隔（60~1800s）：间隔 ×2 且至少 10 分钟，避免长间隔周期误报
    const refreshSec = (v && v.refresh_interval_sec) || 300;
    const stale = p.stale || (age > Math.max(600, refreshSec * 2));
    setLive(p.ok ? (stale ? 'stale' : 'ok') : 'dead');

    if (!p.ok) {
      $('todayBig').textContent = '—';
      $('todayMeta').textContent = esc(p.error || I18N.t('数据异常'));
      $('foot').textContent = I18N.t('更新时间 ') + new Date().toLocaleTimeString();
      return;
    }

    const limits = p.limits || [];
    const monthly = limits.find(l => l.id === 'monthly') || limits.find(l => l.used_pct != null) || null;
    const t = p.meta && p.meta.today;
    const pvKind = p.meta && p.meta.kind;
    const pvBal = (pvKind === 'balance' || pvKind === 'relay');

    // 中部大数字：今日消耗优先（与主界面"今日"口径一致，余额/月度降级到说明文字）
    const balSpeed2 = (p.meta && p.meta.speed) || {};
    if (t && t.delta_pct != null) {
      $('todayBig').textContent = (t.delta_pct > 0 ? '+' : '') + Number(t.delta_pct).toFixed(1) + '%';
      const since = t.since_midnight ? '00:00' : (t.base_label || '');
      $('todayMeta').innerHTML = '<b>' + I18N.t('今日') + '</b>' + I18N.t(' 消耗 ') + fmtUsd(t.delta_usd)
        + (since ? I18N.t(' · 自 ') + esc(since) : '') + I18N.t(' 起算');
    } else if (pvBal && balSpeed2.today_amount != null && p.balance && p.balance.amount != null) {
      $('todayBig').textContent = fmtMoney(balSpeed2.today_amount, p.balance.currency);
      $('todayMeta').innerHTML = '<b>' + I18N.t('今日') + '</b>' + I18N.t(' 消耗 · 余额 ')
        + fmtMoney(p.balance.amount, p.balance.currency);
    } else if (pvBal && p.balance && p.balance.amount != null) {
      $('todayBig').textContent = fmtMoney(p.balance.amount, p.balance.currency);
      $('todayMeta').textContent = (p.balance.currency || '') + I18N.t(' 可用余额')
        + (isPeakNow() ? I18N.t(' · 高峰贵一倍') : '');
    } else if (monthly && monthly.used_pct != null) {
      $('todayBig').textContent = Math.round(monthly.used_pct) + '%';
      $('todayMeta').textContent = I18N.t('月度用量 · ') + I18N.t(esc(monthly.label || I18N.t('每月')));
    } else {
      $('todayBig').textContent = '—';
      $('todayMeta').textContent = I18N.t('暂无用量数据');
    }

    const meta = p.meta || {};
    const balSpeed = meta.speed || {};
    if (pvBal) {
      // 余额型：卡片显示 还能撑 / 日均消耗
      $('barLabel').textContent = 'BALANCE';
      $('monthlyVal').textContent = balSpeed.data_ready ? fmtDaysText(balSpeed.days_left_text) : I18N.t('积累中');
      const fill2 = $('monthlyFill');
      fill2.style.width = '0%';
      fill2.className = 'fill';
      $('monthlyMoney').textContent = balSpeed.data_ready
        ? I18N.t('日均 ') + fmtMoney(balSpeed.daily_amount, p.balance && p.balance.currency) + I18N.t(' · 近') + balSpeed.sample_days + I18N.t('日')
        : I18N.t('消耗数据积累中');
      $('resetText').textContent = I18N.t('可用余额');
    } else {
      // 月度进度条
      const mp = monthly && monthly.used_pct != null ? Math.min(100, monthly.used_pct) : 0;
      const thr = (v.settings && v.settings.notify) ? v.settings.notify : {};
      const warnAt = thr.threshold != null ? thr.threshold : 80;
      const dangerAt = thr.urgent != null ? thr.urgent : 95;
      $('monthlyVal').textContent = monthly && monthly.used_pct != null ? Math.round(monthly.used_pct) + '%' : '--%';
      const fill = $('monthlyFill');
      fill.style.width = mp + '%';
      fill.className = 'fill' + (mp >= dangerAt ? ' danger' : mp >= warnAt ? ' warn' : '');
      $('monthlyMoney').textContent =
        fmtUsd(meta.used_usd != null ? meta.used_usd : 0) + ' / ' + fmtUsd(meta.monthly_limit_usd);
      $('resetText').textContent = monthly ? fmtReset(monthly.reset_in_sec) : '--';
    }

    // 还能撑 / 滚动 / 每周
    const speed = meta.speed || {};
    if (pvBal) {
      $('daysLeft').textContent = balSpeed.data_ready ? fmtDaysText(balSpeed.days_left_text) : I18N.t('积累中');
      $('rollVal').textContent = balSpeed.data_ready
        ? fmtMoney(balSpeed.daily_amount, p.balance && p.balance.currency) + I18N.t('/天') : '--';
      $('weekVal').textContent = balSpeed.data_ready
        ? I18N.t('近') + balSpeed.sample_days + I18N.t('日') : '--';
    } else {
      // 优先科学日均（近 N 天），否则数据不足显示积累中，再否则当前烧速
      if (speed.avg_days_left_text && speed.avg_days_left_text !== '—') {
        $('daysLeft').textContent = fmtDaysText(speed.avg_days_left_text);
      } else if (speed.data_ready === false) {
        $('daysLeft').textContent = I18N.t('积累中');
      } else {
        $('daysLeft').textContent = fmtDaysText(speed.days_left_text) || '—';
      }
      const rolling = limits.find(l => l.id === 'rolling');
      const weekly = limits.find(l => l.id === 'weekly');
      $('rollVal').textContent = rolling && rolling.used_pct != null ? Math.round(rolling.used_pct) + '%' : '--%';
      $('weekVal').textContent = weekly && weekly.used_pct != null ? Math.round(weekly.used_pct) + '%' : '--%';
    }

    renderDetail(limits);

    // 详情四行统计
    try {
      // 今日用量
      const t = meta.today || {};
      if (t.delta_pct != null) {
        const tv = (t.delta_pct > 0 ? '+' : '') + Number(t.delta_pct).toFixed(1) + '%';
        const ts = (t.delta_usd != null) ? ' (' + fmtUsd(t.delta_usd) + ')' : '';
        $('dToday').textContent = tv + ts;
        $('dToday').className = t.delta_pct > 0 ? 'good' : '';
      } else {
        $('dToday').textContent = '—';
      }
      // 余额
      const bal = meta.balance;
      const used = meta.used_usd;
      const lim = meta.monthly_limit_usd;
      if (used != null && lim) {
        $('dBal').textContent = fmtUsd(used) + ' / ' + fmtUsd(lim);
      } else if (bal && bal.amount != null) {
        $('dBal').textContent = fmtUsd(bal.amount);
      } else {
        $('dBal').textContent = '—';
      }
      // 当前速度
      const curTxt = (speed.days_left_text && speed.days_left_text !== '—') ? '~' + fmtDaysText(speed.days_left_text) : '—';
      const curSrc = speed.source === 'today' ? I18N.t('今日') : speed.source === 'short' ? I18N.t('近1h') : speed.source === 'trend' ? I18N.t('趋势') : (speed.source || '');
      $('dCur').textContent = curTxt + (curSrc ? ' · ' + curSrc : '');
      $('dCur').className = (speed.days_left_text && speed.days_left_text !== '—') ? 'good' : 'dim';
      // 3日趋势
      if (speed.avg_days_left_text && speed.avg_days_left_text !== '—') {
        $('dAvg').textContent = '~' + fmtDaysText(speed.avg_days_left_text) + ' · ' + (speed.avg_source ? I18N.t(speed.avg_source) : '');
        $('dAvg').className = 'good';
      } else {
        $('dAvg').textContent = I18N.t('积累中');
        $('dAvg').className = 'dim';
      }
    } catch (e) { }

    $('foot').textContent = I18N.t('更新 ') + new Date(p.fetched_at * 1000).toLocaleTimeString() + (stale ? I18N.t(' · 延迟') : '');
  }

  
async function pull() {
    try {
      const v = await pywebview.api.get_view();
      render(v);
    } catch (e) {
      setLive('dead');
      $('foot').textContent = I18N.t('连接中断');
    }
  }

  // 立即刷新 + 隐藏悬浮窗：统一走 ensureBtnBindings（双保险：initInteractions 内 + DOMContentLoaded 后各绑一次，__bound 防重）
    ensureBtnBindings();
    // 点击切换详情浮层（拖动不触发，三重保险）
  let downX = 0, downY = 0, tracking = false, dragged = false;
  let startWinX = 0, startWinY = 0;
  $('hud').addEventListener('mousedown', (e) => {
    downX = e.clientX; downY = e.clientY;
    startWinX = window.screenX; startWinY = window.screenY;
    tracking = true; dragged = false;
  });
  window.addEventListener('mousemove', (e) => {
    if (tracking && !dragged &&
        (Math.abs(e.clientX - downX) > 5 || Math.abs(e.clientY - downY) > 5)) {
      dragged = true;
    }
  });
  window.addEventListener('mouseup', () => { tracking = false; });
  try {
  $('hud').addEventListener('click', (e) => {
    // 保险1：拖动中位移超阈值（mousemove 未被窗口移动打断时有效）
    if (dragged) { dragged = false; return; }
    // 保险2：窗口位置变化 = 窗口被拖动过（最可靠，不依赖鼠标事件流）
    if (Math.abs(window.screenX - startWinX) > 3 ||
        Math.abs(window.screenY - startWinY) > 3) {
      return;
    }
    detailOn = !detailOn;
    $('hud').classList.toggle('detail-on', detailOn);
  });
  } catch(e) { window.__initErr = window.__initErr || ('hud:' + e.message); }

  // 数据刷新：立即尝试一次（api 可能已就绪），每 30 秒定时刷新，pywebviewready 兜底
  pull();
  setInterval(pull, 10000);   // 10s 自拉兜底（pusher 推送为主，30s 感知太慢）

  /* 点击大数字切换供应商（与主界面卡片对齐） */
  document.addEventListener('click', function(e){
    if(e.target && e.target.id === 'todayBig'){
      var v = window.__mini && window.__mini.getViewData ? window.__mini.getViewData() : null;
      if(!v || !v.providers) return;
      var orderPids = (v.settings && v.settings.order && v.settings.order.providers) || Object.keys(v.providers);
      var cur = window.__miniCur && window.__miniCur.pid;
      var list = orderPids.filter(function(pid){ return v.providers[pid]; });
      if(list.length < 2) return;
      var idx = list.indexOf(cur);
      var next = list[(idx + 1) % list.length];
      window.__miniCur = window.__miniCur || {};
      window.__miniCur.pid = next;
      pull();
    }
  });
  window.addEventListener('pywebviewready', () => { pull(); });

  // 右侧竖条：左右拖动改宽度
  try {
  const rx = $('resizeX');
  rx.addEventListener('mousedown', (e) => {
    e.stopPropagation(); e.preventDefault();
    if(window.pywebview && window.pywebview.api && window.pywebview.api.drag_start){
      window.pywebview.api.drag_start('resizeX');
    }
  });
  } catch(e) { window.__initErr = window.__initErr || ('rx:' + e.message); }

  // 底部横条：上下拖动改高度
  try {
  const ry = $('resizeY');
  ry.addEventListener('mousedown', (e) => {
    e.stopPropagation(); e.preventDefault();
    if(window.pywebview && window.pywebview.api && window.pywebview.api.drag_start){
      window.pywebview.api.drag_start('resizeY');
    }
  });
  } catch(e) { window.__initErr = window.__initErr || ('ry:' + e.message); }

  // 主进程主动推送（多窗口下最可靠的数据通道，绕开 mini 侧 js_api）
  window.__pushView = function(v){
    try{ render(v); }
    catch(e){
      if(window.__miniProbe) window.__miniProbe('render-err:' + String(e && e.message).slice(0, 80));
    }
  };
  window.__scriptEnd = true;
  // mini 窗口隐藏后 evaluate_js 不可用，恢复显示时再拉一次兜底
  document.addEventListener('visibilitychange', () => { if(!document.hidden) pull(); });

  // 顶部拖拽条：移动窗口（JS → js_api.move_mini → Win32，不依赖 pywebview drag region）
  const dragTop = document.querySelector('.drag-top');
  dragTop.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if (window.pywebview && window.pywebview.api && window.pywebview.api.drag_start) {
      window.pywebview.api.drag_start('move');
    }
  });

  // 右下角拖拽调整大小（通过主进程 resize_mini 实时改尺寸）
  const handle = $('resizeHandle');
  handle.addEventListener('mousedown', (e) => {
    e.stopPropagation();
    e.preventDefault();
    if(window.pywebview && window.pywebview.api && window.pywebview.api.drag_start){
      window.pywebview.api.drag_start('resize');
    }
  });
  /* 测试接口（在闭包内：render/pull/viewData 在此作用域） */
  window.__mini = {
    render: render,
    pull: pull,
    getViewData: function(){ return viewData; },
  };
  }  /* initInteractions 结束 */

  /* 兜底按钮绑定（双保险）：即使 initInteractions 中途异常，刷新/隐藏按钮也保证可用。
     统一走全局函数（与 inline onclick 同源，busy 锁防双触发）。 */
  function ensureBtnBindings(){
    const r = document.getElementById('refresh');
    if (r && !r.__bound) {
      r.__bound = true;
      r.addEventListener('click', function(ev){ ev.stopPropagation(); window.__miniRefresh(); });
    }
    const h = document.getElementById('minHide');
    if (h && !h.__bound) {
      h.__bound = true;
      h.addEventListener('click', function(ev){ ev.stopPropagation(); window.__miniHide(); });
    }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function(){ try { initInteractions(); } catch(e) { window.__initErr = window.__initErr || ('init:' + e.message); } });
    document.addEventListener('DOMContentLoaded', function(){ try { ensureBtnBindings(); } catch(e) {} });
  } else {
    try { initInteractions(); } catch(e) { window.__initErr = window.__initErr || ('init:' + e.message); }
    try { ensureBtnBindings(); } catch(e) {}
  }

</script>
</body>
</html>
